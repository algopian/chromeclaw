<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Microphone permission</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #0b0b0d;
        color: #e8e8ea;
      }
      main {
        width: 340px;
        max-width: calc(100vw - 32px);
        padding: 28px 24px;
        border-radius: 14px;
        background: #17171b;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .icon {
        font-size: 34px;
        line-height: 1;
      }
      h1 {
        margin: 14px 0 6px;
        font-size: 17px;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.5;
        color: #a5a5ad;
      }
      button {
        width: 100%;
        padding: 11px 16px;
        border: 0;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: #4f7cff;
        color: #fff;
      }
      button:hover {
        background: #4069e6;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 16px;
        font-size: 13px;
        min-height: 18px;
      }
      #status.ok {
        color: #52c07a;
      }
      #status.err {
        color: #f0616d;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">&#127908;</div>
      <h1>Allow microphone access</h1>
      <p>
        ChromeClaw needs microphone permission to transcribe your voice. Click below and choose
        <strong>Allow</strong> when your browser asks.
      </p>
      <button id="allow" type="button">Allow microphone</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="mic-permission.js"></script>
  </body>
</html>
